<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166B42"/>
      <stop offset="50%" stop-color="#0F5132"/>
      <stop offset="100%" stop-color="#0A3B24"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD966"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#A8861F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="256" cy="256" r="248" fill="url(#bgGradient)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#goldGradient)" stroke-width="8"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.4"/>
  
  <g opacity="0.08" stroke="#C9A227" stroke-width="1.5" fill="none">
    <polygon points="256,60 356,140 356,260 256,340 156,260 156,140" />
    <polygon points="256,90 330,148 330,252 256,310 182,252 182,148" />
    <line x1="256" y1="60" x2="256" y2="340"/>
    <line x1="156" y1="140" x2="356" y2="260"/>
    <line x1="356" y1="140" x2="156" y2="260"/>
  </g>
  
  <g filter="url(#glow)">
