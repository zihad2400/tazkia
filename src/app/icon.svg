  <g>
    <rect x="140" y="200" width="22" height="140" fill="url(#goldGradient)"/>
    <path d="M 140 200 L 151 175 L 162 200 Z" fill="#C9A227"/>
    <circle cx="151" cy="170" r="6" fill="#FFD966"/>
    
